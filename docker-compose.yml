services:
  mysql:
    image: mysql:8.4
    container_name: procurement-mysql
    environment:
      # 本地开发默认 root，可用环境变量覆盖；公开部署务必换成强口令。
      # 用 ${VAR:-default} 而不是写死，是为了让"改口令"只需要改 .env，不用改 compose。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: procurement
      TZ: Asia/Shanghai
    # 3306 is already occupied by the MySQL service on this Windows host.
    # Containers still use mysql:3306 internally; 3307 is only the host access port.
    ports: ["3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      # 不再挂载初始化 SQL：容器只负责建空库，表结构与种子数据全部由后端启动时的
      # Flyway（backend/src/main/resources/db/migration）执行，避免两份 DDL 漂移。
    healthcheck:
      # $$ 是 compose 的转义：容器内取同名环境变量，避免口令写死在健康检查里
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    container_name: procurement-redis
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
  backend:
    # 构建上下文收敛到 backend/：根目录那份 Dockerfile 与 pom.xml 已删除，
    # 免得同一个镜像有两份"看起来都对"的定义，改了一份忘了另一份。
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procurement-backend
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/procurement?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      # 与 mysql 服务用同一个变量，避免"库口令改了、应用还连旧口令"这种低级不一致
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: docker
      # 未设置 JWT_SECRET 时 compose 直接报错退出，而不是悄悄用一个公开的默认密钥启动
      JWT_SECRET: ${JWT_SECRET:?请先设置环境变量 JWT_SECRET（至少 32 字节），可参考 .env.example}
    ports: ["8080:8080"]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: procurement-frontend:local
    container_name: procurement-frontend
    depends_on: [backend]
    # Port 80 is reserved by Windows HTTP.sys on this host.
    ports: ["8081:80"]
    volumes:
      # nginx 配置跟着前端走：frontend/nginx.conf 才是唯一一份
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  mysql_data:
  redis_data:
