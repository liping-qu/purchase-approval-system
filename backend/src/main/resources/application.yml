server:
  port: 8080
spring:
  application:
    name: procurement-approval-system
  flyway:
    # 结构变更唯一入口：db/migration 下的版本化脚本
    enabled: true
    locations: classpath:db/migration
    # 存量库（已有表、没有 flyway_schema_history）自动以 V1 为基线，不重跑 V1，只执行 V2 之后的增量。
    # 全新空库不会被 baseline，会依次执行 V1~Vn。
    baseline-on-migrate: true
    baseline-version: 1
    # 迁移失败立即中止启动，避免"半套结构"继续提供服务
    fail-on-missing-locations: true
  sql:
    init:
      # 旧的 schema.sql 已废弃，结构改由 Flyway 管理
      mode: never
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:procurement}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    # 默认值是本地开发专用；公开/生产部署必须通过 MYSQL_PASSWORD 注入强口令。
    # 之所以留默认值而不是像 JWT_SECRET 那样强制必填：数据库口令缺失时应用会在
    # 连接池初始化阶段直接失败，本身就是"启动即暴露"，再加一层必填只是让本地开发更麻烦。
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
app:
  jwt:
    # 故意不给默认值：默认密钥等于公开密钥，任何人 clone 后都能伪造 token。
    # 未注入 JWT_SECRET 时应用直接启动失败（JwtService 构造器里显式抛错）。
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  auth-cache:
    # 鉴权快照缓存：命中后每请求省掉 2 次查库（sys_user+部门、sys_role+用户角色）。
    # 置 false 可完全退化为每请求查库，用于压测对比与故障排查。
    enabled: ${AUTH_CACHE_ENABLED:true}
    # TTL 只是兜底，正确性靠改密/改用户/删用户后的显式失效，不要把它当成一致性保证。
    ttl-seconds: ${AUTH_CACHE_TTL_SECONDS:300}
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    # %X{traceId} 由 TraceIdFilter 写入 MDC，-: 表示缺失时留空
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
